<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
        />
        <meta name="color-scheme" content="dark" />
        <meta name="theme-color" content="#13141c" />
        <meta name="mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-capable" content="yes" />
        <title>Pi Pocket</title>
        <link rel="manifest" href="/manifest.webmanifest" crossorigin="use-credentials" />
        <link rel="icon" href="/icon.svg" type="image/svg+xml" />
        <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
        <link rel="preload" href="/fonts/Geist.woff2" as="font" type="font/woff2" crossorigin />
        <link
            rel="preload"
            href="/fonts/JetBrainsMono.woff2"
            as="font"
            type="font/woff2"
            crossorigin
        />
        <link rel="preload" href="/style.css" as="style" />
        <!--
            The cascade layers, in the order they win: the app's own CSS and extensions' (pocket), the colors chosen in
            Appearance (palette), then the theme (theme.js). Sizes people choose stay inline and win over all three.
        -->
        <style>
            @layer pocket, palette, theme;
            @import url("/style.css") layer(pocket);
        </style>
        <!-- The last look this browser used (theme.js keeps it), before the first paint: no flash of another theme. -->
        <script>
            try {
                var look = JSON.parse(localStorage.getItem("pocket.themeCache") || "null");
                if (look) {
                    var root = document.documentElement;
                    var colors = "";
                    for (var name in look.palette) colors += name + ":" + look.palette[name] + ";";
                    var palette = document.createElement("style");
                    palette.id = "pocket-palette";
                    palette.textContent = "@layer palette{:root{" + colors + "}}";
                    document.head.appendChild(palette);
                    // The theme's stylesheets, written into the page so it waits for them as for a <link>. Not in
                    // safe mode (safe-mode.js), and only addresses of theme files.
                    var query = new URLSearchParams(location.search);
                    var safe = query.has("noext")
                        ? !/^(0|false|off|no)$/i.test(query.get("noext").trim())
                        : sessionStorage.getItem("pocket.noext") === "1";
                    var sheets = (look.css || []).filter(function (url) {
                        return /^\/themes\/[a-z0-9-]+\/[A-Za-z0-9_-]+\/theme\.css$/.test(url);
                    });
                    if (!safe && sheets.length > 0) {
                        document.write(
                            "<style id='pocket-theme' data-urls='" +
                                JSON.stringify(sheets) +
                                "'>" +
                                sheets
                                    .map(function (url) {
                                        return '@import url("' + url + '") layer(theme);';
                                    })
                                    .join("") +
                                "</style>",
                        );
                    }
                    for (var each in look.vars) root.style.setProperty(each, look.vars[each]);
                    for (var key in look.attrs) root.dataset[key] = look.attrs[key];
                    document
                        .querySelector('meta[name="theme-color"]')
                        .setAttribute("content", look.color || look.vars["--o-bg"]);
                }
            } catch (error) {}
        </script>
        <script type="importmap">
            {
                "imports": {
                    "preact": "/vendor/preact.mjs",
                    "preact/hooks": "/vendor/preact-hooks.mjs",
                    "htm": "/vendor/htm.mjs",
                    "marked": "/vendor/marked.mjs",
                    "dompurify": "/vendor/purify.mjs"
                }
            }
        </script>
    </head>
    <body>
        <!-- The same boot screen the app shows while it starts (Boot in ui.js), so nothing jumps when the script takes over. -->
        <div id="app">
            <div class="boot" role="status">
                <div class="boot-mark" aria-hidden="true">π</div>
                <div class="boot-bar" aria-hidden="true"><span></span></div>
                <div class="boot-caption">starting</div>
            </div>
        </div>
        <script type="module" src="/app.js"></script>
    </body>
</html>
